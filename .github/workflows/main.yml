---
name: MainFlow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment to deploy
        required: true
        default: DEV
        type: choice
        options:
          - TEST
          - DEV

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_S3 }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_S3 }}

jobs:
  build:
    runs-on: ubuntu-20.04
    env:
      NODE_VERSION: 18.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install NPM pkgs
        run: npm ci
      - name: build
        run: |
          npm run build:prod
          cp src/demo.html dist/demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: s3_site
          path: dist

  deploy:
    needs: [build]
    runs-on: ubuntu-20.04
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://${{ vars.AWS_BUCKET }}.3dlook.me
    env:
      AWS_CF_DISTRIBUTION_ID: ${{ secrets.AWS_CF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s3_site
          path: dist
      - uses: reggionick/s3-deploy@v4
        with:
          folder: ./dist
          bucket-region: ${{ vars.AWS_BUCKET_ZONE }}
          bucket: ${{ vars.AWS_BUCKET }}.3dlook.me
          dist-id: ${{ env.AWS_CF_DISTRIBUTION_ID }}
          invalidation: /
          delete-removed: true
          private: true
          cache: 120

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_BUCKET_ZONE }}

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ env.AWS_CF_DISTRIBUTION_ID }} --paths "/*"
